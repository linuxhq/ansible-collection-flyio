---
- name: Verify
  hosts: all

  roles:
    - apps_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _apps_info_dict is defined
          - _apps_info_dict['molecule-apps-info'] is defined
          - _apps_info_dict['molecule-apps-info'].name == 'molecule-apps-info'
          - _apps_info_dict['molecule-apps-info-2'] is defined
          - _apps_info_dict['molecule-apps-info-2'].name == 'molecule-apps-info-2'

    - name: Ensure info is gathered without a target
      ansible.builtin.include_role:
        name: apps_info
      vars:
        apps_info_org_slug: null

    - name: Ensure empty info is verified
      ansible.builtin.assert:
        that:
          - _apps_info_list == []
          - _apps_info_dict == {}
...
