---
- name: Ensure flyio volumes are batched
  tags:
    - volumes
  ansible.builtin.include_tasks:
    apply:
      tags:
        - volumes
    file: include.yml
  loop:
    "{{ q('ansible.builtin.subelements',
          volumes_list,
          'volumes',
          {'skip_missing': true}) |
        batch(volumes_batch) }}"
  loop_control:
    label: "{{ __volumes_list | length }}"
    loop_var: __volumes_list
...
