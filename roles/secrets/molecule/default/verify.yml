---
- name: Verify
  hosts: all

  pre_tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        secrets_list:
          "{{ secrets_list |
              map('combine', {'state': 'absent'}) }}"
        apps_list:
          "{{ apps_list |
              map('combine', {'state': 'absent'}) }}"

  roles:
    - secrets
    - apps

  post_tasks:
    - name: Ensure secret values are hidden from task output by default
      ansible.builtin.assert:
        that:
          - secrets_no_log | bool
...
