---
- name: Verify
  hosts: all

  roles:
    - role: secrets_info
      secrets_info_app_name: "{{ secrets_list.0.app_name }}"

  post_tasks:
    - name: Ensure secrets are verified
      ansible.builtin.assert:
        that:
          - _secrets_info_dict.APP_SECRET is defined
          - _secrets_info_dict.APP_SECRET.digest is defined
          - _secrets_info_dict.APP_SECRET.value is not defined
...
