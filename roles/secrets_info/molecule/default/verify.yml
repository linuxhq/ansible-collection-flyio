---
- name: Verify
  hosts: all

  roles:
    - secrets_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _secrets_info_dict.APP_SECRET is defined
          - _secrets_info_dict.APP_SECRET.digest is defined
          - _secrets_info_dict.APP_SECRET.value is not defined

    - name: Ensure info is gathered without a target
      ansible.builtin.include_role:
        name: secrets_info
      vars:
        secrets_info_app_name: null

    - name: Ensure empty info is verified
      ansible.builtin.assert:
        that:
          - _secrets_info_list == []
          - _secrets_info_dict == {}
...
