---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: vagrant

platforms:
  - name: almalinux9
    box: bento/almalinux-9.6
    cpus: 4
    memory: 4096

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        apps_api_token: "{{ lookup('env', 'FLY_API_TOKEN') }}"
        apps_list:
          - name: molecule-test-app
            org_slug: "{{ lookup('env', 'FLY_ORG_SLUG') }}"

        secrets_api_token: "{{ lookup('env', 'FLY_API_TOKEN') }}"
        secrets_info_api_token: "{{ lookup('env', 'FLY_API_TOKEN') }}"
        secrets_info_app_name: molecule-test-app
        secrets_list:
          - app_name: molecule-test-app
            secrets:
              - name: APP_SECRET
                value: molecule-secret

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
