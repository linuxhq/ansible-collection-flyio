---
- name: Ensure flyio machines are batched
  tags:
    - machines
  ansible.builtin.include_tasks:
    apply:
      tags:
        - machines
    file: include.yml
  loop:
    "{{ q('ansible.builtin.subelements',
          machines_list,
          'machines',
          {'skip_missing': true}) |
        batch(machines_batch) }}"
  loop_control:
    label: "{{ __machines_list | length }}"
    loop_var: __machines_list
...
