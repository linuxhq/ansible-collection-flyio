---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: vagrant

platforms:
  - name: almalinux9
    box: bento/almalinux-9.6
    cpus: 4
    memory: 4096

provisioner:
  name: ansible
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        machines_api_token: "{{ lookup('env', 'FLY_API_TOKEN') }}"
        machines_app_name: molecule-test-app
        machines_list:
          - name: molecule-web
            region: ord
            image: registry.fly.io/molecule-test-app:latest
            guest:
              cpu_kind: shared
              cpus: 1
              memory_mb: 256

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
