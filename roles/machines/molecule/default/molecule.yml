---
provisioner:
  inventory:
    group_vars:
      all:
        apps_list:
          - name: molecule-machines
            org_slug: linuxhq-dev

        machines_list:
          - app_name: molecule-machines
            machines:
              - guest:
                  cpu_kind: shared
                  cpus: 1
                  memory_mb: 256
                image: nginx:alpine
                name: molecule-web
                region: ord
              - guest:
                  cpu_kind: shared
                  cpus: 1
                  memory_mb: 256
                image: nginx:alpine
                name: molecule-worker
                region: ord

        volumes_info_app_name: molecule-machines
...
