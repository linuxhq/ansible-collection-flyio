---
- name: Verify
  hosts: all

  roles:
    - ip_addresses_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _ip_addresses_info_dict is defined
          - _ip_addresses_info_dict | length > 0
          - _ip_addresses_info_dict | dict2items | selectattr('value.type', 'equalto', 'v4') | list | length > 0
          - _ip_addresses_info_dict | dict2items | selectattr('value.type', 'equalto', 'v6') | list | length > 0

    - name: Ensure info is gathered without a target
      ansible.builtin.include_role:
        name: ip_addresses_info
      vars:
        ip_addresses_info_app_name: null

    - name: Ensure empty info is verified
      ansible.builtin.assert:
        that:
          - _ip_addresses_info_list == []
          - _ip_addresses_info_dict == {}
...
