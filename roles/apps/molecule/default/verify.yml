---
- name: Verify
  hosts: all

  roles:
    - apps_info

  post_tasks:
    - name: Ensure apps are verified
      ansible.builtin.assert:
        that:
          - _apps_info_dict is defined
          - _apps_info_dict['molecule-apps'] is defined
          - _apps_info_dict['molecule-apps'].name == 'molecule-apps'
          - _apps_info_dict['molecule-apps-2'] is defined
          - _apps_info_dict['molecule-apps-2'].name == 'molecule-apps-2'
...
