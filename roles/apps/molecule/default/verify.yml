---
- name: Verify
  hosts: all

  roles:
    - apps_info

  post_tasks:
    - name: Ensure apps are verified
      ansible.builtin.assert:
        that:
          - _apps_info_dict is defined
          - _apps_info_dict['molecule-apps'] is defined
          - _apps_info_dict['molecule-apps'].name == 'molecule-apps'
          - _apps_info_dict['molecule-apps-2'] is defined
          - _apps_info_dict['molecule-apps-2'].name == 'molecule-apps-2'

    - name: Ensure synchronous app is removed
      ansible.builtin.include_role:
        name: apps
      vars:
        apps_async: 0
        apps_list:
          - name: molecule-apps-2
            state: absent

    - name: Ensure synchronous app removal reports a change
      ansible.builtin.assert:
        that:
          - __apps_result.results | selectattr('changed') | list | length == 1

    - name: Ensure inline-polled app is created
      ansible.builtin.include_role:
        name: apps
      vars:
        apps_list:
          - name: molecule-apps-2
            org_slug: linuxhq-dev
        apps_poll: 1

    - name: Ensure inline-polled app creation reports a change
      ansible.builtin.assert:
        that:
          - __apps_result.results | selectattr('changed') | list | length == 1
          - __apps_status.results | rejectattr('skipped', 'defined') | list | length == 0
...
