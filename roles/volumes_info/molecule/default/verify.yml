---
- name: Verify
  hosts: all
  roles:
    - volumes_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _volumes_info_dict is defined
          - _volumes_info_dict['molecule_data'] is defined
          - _volumes_info_dict['molecule_data'].name == 'molecule_data'
          - _volumes_info_dict['molecule_data'].region == 'ord'
          - _volumes_info_dict['molecule_data'].size_gb == 1
          - _volumes_info_dict['molecule_logs'] is defined
          - _volumes_info_dict['molecule_logs'].name == 'molecule_logs'
          - _volumes_info_dict['molecule_logs'].region == 'ord'
          - _volumes_info_dict['molecule_logs'].size_gb == 1

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        volumes_list:
          "{{ volumes_list |
              map('combine', {'state': 'absent'}) }}"
        apps_list:
          "{{ apps_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _role }}"
      loop:
        - volumes
        - apps
      loop_control:
        label: "{{ _role | d(none) }}"
        loop_var: _role
...
