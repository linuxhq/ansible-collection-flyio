---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        apps_api_token: "{{ lookup('env', 'FLY_API_TOKEN') }}"

        apps_info_api_token: "{{ apps_api_token }}"
        apps_info_org_slug: linuxhq-dev

        ip_addresses_api_token: "{{ apps_api_token }}"

        ip_addresses_info_api_token: "{{ apps_api_token }}"

        machines_api_token: "{{ apps_api_token }}"

        machines_info_api_token: "{{ apps_api_token }}"

        secrets_api_token: "{{ apps_api_token }}"

        secrets_info_api_token: "{{ apps_api_token }}"

        volumes_api_token: "{{ apps_api_token }}"

        volumes_info_api_token: "{{ apps_api_token }}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
