---
bugfixes:
  - apps_info - return an empty ``apps`` list when ``org_slug`` names an
    organization that does not exist, like the other info modules do for a
    missing parent, instead of failing with HTTP 404.
  - machines - accept and send ``restart.max_retries`` with any
    ``restart.policy``, as Fly.io does, instead of failing unless the policy
    is ``on-failure``.
