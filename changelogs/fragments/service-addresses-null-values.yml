---
bugfixes:
  - ip_addresses - match and release addresses by ``type`` only when they are
    not assigned to a service, so an address allocated for a service is no
    longer reported as the app's address or released in its place.
  - ip_addresses, ip_addresses_info - return the ``service_name`` an address
    is assigned to.
  - machines_exec - include ``error`` in the failure for output that is too
    large, like other API failures.
trivial:
  - machines - name the key in the failure for a null ``env``, ``metadata``,
    or ``services[].ports[].http_options.response.headers`` value.
  - machines - return the matching ``machine_ids`` when more than one live
    Machine has the requested name, like volumes returns ``volume_ids``.
  - volumes - say that only live volumes with the name in ``region`` make a
    name lookup ambiguous.
  - volumes - reuse the volume lookup when waiting for a volume.
