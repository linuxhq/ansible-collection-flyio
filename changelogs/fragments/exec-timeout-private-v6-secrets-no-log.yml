---
breaking_changes:
  - secrets role - default ``secrets_no_log`` to ``true``, because each loop
    item carries the plaintext secret value and Ansible shows it in task
    output, such as with ``-v``. Set ``secrets_no_log`` to ``false`` to keep
    the previous visible output.
bugfixes:
  - machines_exec - fail with ``changed=true`` when Fly.io reports that the
    command exceeded ``timeout`` (HTTP 408), because the command may have run.
  - ip_addresses - match ``type=private_v6`` only against the organization's
    default network, so ``state=absent`` no longer releases, and
    ``state=present`` no longer reuses, a private address on a custom network.
  - ip_addresses, ip_addresses_info - return the ``network`` of each address.
trivial:
  - apps - state that ``force`` is not sent and that Fly.io deletes an app
    with running Machines without it.
  - machines - state that a response header set to ``false`` makes Fly Proxy
    strip it from responses, and that a configured header name cannot be
    removed.
