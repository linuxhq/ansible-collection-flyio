---
bugfixes:
  - machines - require ``restart.max_retries`` to be at least ``1`` before
    any change, including in check mode, because Fly.io stores ``0`` as its
    default of ``3`` and the task could never converge.
  - apps, ip_addresses, machines, machines_exec, secrets, volumes - report
    ``changed=true`` when a write reached Fly.io but its response was lost,
    for example to a read timeout or a dropped connection, because the write
    may have been applied. machines_exec says that the command may have run.
  - apps, apps_info, machines, machines_exec, machines_info, secrets,
    secrets_info, volumes, volumes_info - include the reason Fly.io returns
    with an HTTP error in the failure message.
trivial:
  - secrets - read ``version`` from Fly.io's set and remove responses without
    defensive guards.
  - machines, machines_exec, machines_info, volumes, volumes_info - share the
    Machine and volume lookups and the terminal Machine states.
  - machines - document that ``state=stopped`` leaves a never-started
    Machine unchanged and discards a suspended Machine's snapshot.
  - ip_addresses, ip_addresses_info - say that an empty network name means
    the organization's default network.
