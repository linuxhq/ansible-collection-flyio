---
minor_changes:
  - >-
    machines - send values that Fly.io rejects on the only write to Fly.io
    instead of failing before the request: a check ``port`` or service
    ``port``, ``start_port``, or ``end_port`` of ``0``, an empty check
    ``type`` or check name, ``guest.cpus`` or ``guest.memory_mb`` of ``0``,
    an empty ``guest.cpu_kind``, ``statics[].guest_path``,
    ``statics[].url_prefix``, ``mounts[].volume``, ``files[].secret_name``,
    or ``env`` key. Nothing is changed.
  - >-
    machines - send empty values that Fly.io stores as given instead of
    failing before the request: a check ``kind``, ``method``, ``path``,
    ``protocol``, or ``tls_server_name``, a ``metadata`` key, a
    whitespace-only check header ``name``, and a service HTTP response
    header name. An empty check header ``name`` still fails, because Fly.io
    drops it.
  - >-
    volumes - send a create without ``size_gb`` to Fly.io instead of failing
    before the request. Fly.io rejects it, so no volume is created.
trivial:
  - apps - document that ``org_slug`` must be the slug Fly.io reports, not the
    ``personal`` alias.
  - secrets_info - document that ``secrets`` is empty when the app does not
    exist.
