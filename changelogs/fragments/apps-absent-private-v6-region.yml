---
bugfixes:
  - >-
    apps - with ``state=absent``, fail before deleting, including in check mode, when the existing app's organization slug or network
    differs from a set ``org_slug`` or ``network``.
    Playbooks that set a mismatched ``org_slug`` or ``network`` to delete an app now fail instead of deleting it.
  - >-
    ip_addresses - fail before any lookup or allocation when ``type=private_v6`` is given a region other than ``global``,
    because Fly.io allocates private IPv6 addresses globally.
    Previously the module allocated a global address, failed on the region it returned, and allocated another address on every run.
  - ip_addresses - return the allocated address in ``ip_address`` when Fly.io returns unexpected allocation data.
  - >-
    secrets - document that creating or updating a Machine after a secret change uses the app's current secrets version
    instead of referring to an unsupported ``min_secrets_version`` option.
  - volumes, volumes_info - document more of the volume fields that Fly.io returns.
  - machines, machines_info - document more of the Machine fields that Fly.io returns.
trivial:
  - volumes - validate a created volume's response data once.
