  1.1.4:
    changes:
      breaking_changes:
      - machines - removed the ``guest.gpu_kind`` and ``guest.gpus`` options; the
        Fly.io Machines API rejects requests that set them.
      bugfixes:
      - apps - document that ``org_slug`` and ``network`` are used only when creating
        an app and are not checked against an existing app.
      - apps - send ``name`` instead of ``app_name`` when creating an app, report
        a created app even when the follow-up read briefly returns 404, and return
        the deleted app.
      - machines - accept a Machine that completes and destroys itself during the
        wait when ``auto_destroy`` is set, instead of failing.
      - machines - accept a Machine that destroys itself after a start, stop, or update
        when ``auto_destroy`` is set on the Machine, instead of failing with a 404
        or state error.
      - machines - accept a created or updated Machine that has already moved on to
        a transitional state, such as a job exiting, after its settled wait succeeds.
      - machines - accept a start or stop that worked when the Machine has already
        moved on afterwards, such as an ``auto_destroy`` Machine that is ``destroying``
        after stopping or a job that is ``stopping`` after starting.
      - machines - after a successful start, stop, or transition wait, accept a Machine
        that has already reached its next stable state instead of failing depending
        on timing.
      - machines - allow lowering ``services[].concurrency.hard_limit`` below the
        Machine's current soft limit, which Fly.io lowers to match, and reject a requested
        ``soft_limit`` above the hard limit that applies before updating the Machine.
      - machines - apply ``wait_timeout`` once across all waits in a task instead
        of to each wait separately.
      - machines - check the Machine state at least once when the ``wait_timeout``
        budget is already spent, instead of reporting a timeout without asking.
      - machines - document how a service without ``protocol`` pairs with current
        services, and that a lookup by ``name`` fails when several Machines share
        it.
      - machines - document that Fly.io currently ignores ``init.tty``.
      - machines - document that ``env`` and ``metadata`` values must be strings,
        that ``state=absent`` forcibly stops a running Machine, and that ``env``,
        ``headers``, and ``raw_value`` fields are removed from returned Machine data.
      - machines - document that fields omitted from a listed service, port, check,
        or static keep their current values.
      - machines - document that header names not listed in ``http_options.response.headers``
        keep their current values, and that setting a header to ``false`` removes
        it.
      - machines - document which options replace the Machine's current values (``env``,
        ``metadata``, ``checks``, ``services``, ``files``, ``statics``) and which
        are merged (``guest``, ``init``, ``restart``), including that ``metadata``
        must list any ``fly_*`` keys to keep.
      - machines - drop a percentage-based volume extension when ``mounts[].add_size_gb``
        is set, since Fly.io treats the two as mutually exclusive, and document that
        omitted mount fields keep their current values.
      - machines - fail clearly before updating a stopped spot Machine, which Fly.io
        cannot update without starting it.
      - machines - fail when multiple Machines share the requested ``name`` instead
        of silently selecting the first one.
      - machines - handle every Machine state from both the Fly.io Machines API specification
        and the Machine states documentation, including ``migrating`` and ``pending``,
        and fail clearly for ``archived`` Machines except with ``state=absent``.
      - machines - keep the attached volume ID when updating a Machine whose mount
        was requested by volume name, so the update cannot select a different volume.
      - machines - pair listed services and ports that share identity keys, such as
        the same ``internal_port`` and ``protocol``, with current entries in order,
        consistently when checking for changes and when merging.
      - machines - reject ``restart.max_retries`` with a policy other than ``on-failure``
        consistently, without modifying the requested options, and reject Machines
        that become ``archived`` while being waited on.
      - machines - reject empty ``guest.cpu_kind``, ``guest.host_dedication_id``,
        ``statics[].tigris_bucket``, ``statics[].index_document``, and ``services[].ports[].proxy_proto_options.version``
        values, which Fly.io omits from the returned configuration.
      - machines - replace a check when its ``type`` changes instead of merging fields
        from the old check type.
      - machines - report an unreachable Machine host (``host_status`` other than
        ``ok``) clearly instead of as malformed data or an unapplied update.
      - machines - require ``services[].concurrency.soft_limit`` to be at least 1,
        because Fly.io replaces 0 with its default of 20 and the task could never
        converge.
      - machines - return the Machine as it was before deletion when it is destroyed.
      - machines - stop marking ``checks``, ``env``, and ``services[].ports[].http_options.response.headers``
        as ``no_log``, which masked matching values (such as ports, handlers, and
        image tags) throughout the returned Machine data.
      - machines - tolerate wait errors from a Machine that destroys itself when ``auto_destroy``
        is set, and confirm its removal by reading it again.
      - machines - treat an empty requested ``services[].concurrency`` or ``services[].ports[].proxy_proto_options``
        as matching a Machine that omits it.
      - machines - validate ``mounts[].extend_threshold_percent`` (0 or 50-99) and
        ``mounts[].add_size_gb`` (0-100) against the API limits.
      - machines - wait for ``migrating`` and ``pending`` Machines to settle, and
        report the current state when a wait ends in an unexpected state such as ``failed``.
      - machines - wait for created and updated Machines with the ``settled`` wait
        state filtered to the new Machine ``version``, and use ``version`` instead
        of the deprecated ``instance_id`` for waits and ``current_version``.
      - machines - with ``state=started`` or ``state=stopped``, decide whether a vanished
        Machine destroyed itself from its own configuration, not from the ``auto_destroy``
        option.
      - machines, machines_info - keep caller-named ``metadata`` keys and check names
        such as ``env`` in returned Machine data; only secret-bearing fields are removed.
      - machines, volumes - ignore resources that are being destroyed when looking
        up by ``id`` or ``name``, and with ``state=absent`` prefer a live resource
        over one being destroyed when both share a name.
      - machines, volumes - reject region lists and region groups such as ``us`` for
        ``region``; Fly.io would pick a different region, so the module could never
        match it and re-created volumes on every run.
      - machines, volumes - report ``changed=false`` for a resource that is still
        transitioning when ``wait=false`` and no change is needed, instead of failing.
      - machines, volumes, ip_addresses - normalize ``region`` to the stripped lowercase
        region code before using it.
      - machines_exec - mark ``stdin`` as ``no_log``, limit ``timeout`` to 600 seconds,
        and document that a non-zero exit code fails the task.
      - machines_exec - return ``exit_signal`` and fail when the command is terminated
        by a signal.
      - machines_exec - treat a missing ``exit_code`` in the API response as a successful
        exit.
      - module_utils - report truncated HTTP responses as API errors, detect missing
        GraphQL apps by error code, and always poll at least once in wait helpers.
      - module_utils - send ``fm1a_`` macaroon tokens, and comma-separated tokens
        with spaces, with the ``FlyV1`` authorization scheme, as Fly.io's own client
        does.
      - module_utils - strip the API token before checking for control characters
        so a trailing newline is accepted.
      - secrets - correct the note on applying a changed secret; running Machines
        must be created or updated, not restarted, to load the new value.
      - volumes - require ``size_gb`` when creating a volume, as the Fly.io API does,
        and stop capping ``size_gb`` at 500 so organizations with a higher maximum
        can use it.
      - volumes - stop waiting and fail clearly when a volume enters the ``failed``
        state during a wait, instead of reporting a timeout.
      - volumes - treat ``destroying`` volumes as being deleted, fail clearly for
        ``failed`` volumes, apply ``wait_timeout`` once per task, and return the volume
        after deletion.
      deprecated_features:
      - apps - the ``force`` option is ignored because the Fly.io Machines API does
        not support it, and will be removed in version 2.0.0.
      - machines - the ``mounts[].name`` and ``mounts[].encrypted`` options are ignored
        because Fly.io sets them, and will be removed in version 2.0.0.
      release_summary: Bug fix release from a full audit of the collection's plugins
        against the Fly.io Machines API specification, covering Machine, volume, app,
        secret, and IP address idempotence, waits, validation, and secret handling.
    fragments:
    - plugins-audit-fixes.yml
    release_date: '2026-11-11'
  1.1.5:
    changes:
      breaking_changes:
      - ip_addresses, ip_addresses_info - return IP addresses as Fly.io reports them;
        a global region stays ``global`` and null fields are kept.
      - machines, machines_info - return Machine data as Fly.io reports it, including
        ``env``, HTTP headers, and file contents; use task-level ``no_log``.
      - machines_exec - ``stdin`` is no longer ``no_log``, so ``stdout``, ``stderr``,
        and the exit codes are no longer masked when they contain the ``stdin`` value.
        Use task-level ``no_log`` when passing sensitive input.
      bugfixes:
      - apps - document that Fly.io creates the network named by ``network`` when
        it does not exist and that ``default`` selects the organization's default
        network.
      - apps - fail before any change, including in check mode, when an existing app's
        organization slug or network differs from a set ``org_slug`` or ``network``.
        Playbooks that set a mismatched ``org_slug`` or ``network`` for an existing
        app now fail instead of reporting no change.
      - apps - in check mode, return ``app`` with the requested name when the app
        would be created, as a real create does.
      - apps - with ``state=absent``, fail before deleting, including in check mode,
        when the existing app's organization slug or network differs from a set ``org_slug``
        or ``network``. Playbooks that set a mismatched ``org_slug`` or ``network``
        to delete an app now fail instead of deleting it.
      - apps, apps_info - document the app fields that Fly.io returns.
      - apps, ip_addresses, machines, secrets, volumes roles - support a ``*_poll``
        value greater than zero. The roles no longer fail with "could not find job"
        and report the module's change.
      - apps, machines, secrets, volumes - with ``state=absent``, report no change
        when the resource is deleted elsewhere between the lookup and the delete.
      - apps, volumes - allow slack on each status check while waiting, so a slow
        final check reports the timeout instead of a connection error.
      - apps_info, machines_info, volumes_info - document that a lookup by ``name``
        or ``id`` fails when the resource does not exist.
      - ip_addresses - add examples that allocate a private IPv6 address, allocate
        a regional address, and release an address by type and region.
      - ip_addresses - fail before any lookup or allocation when ``type=private_v6``
        is given a region other than ``global``, because Fly.io allocates private
        IPv6 addresses globally. Previously the module allocated a global address,
        failed on the region it returned, and allocated another address on every run.
      - ip_addresses - report no change instead of failing when the address is released
        elsewhere between the lookup and the release.
      - ip_addresses - return the allocated address in ``ip_address`` when Fly.io
        returns unexpected allocation data.
      - machines - accept an empty string for ``statics[].tigris_bucket`` and ``statics[].index_document``
        to clear them.
      - machines - document that Fly.io deprecates ``guest.persist_rootfs`` in favor
        of the Machine configuration's ``rootfs.persist`` setting.
      - machines - document that ``services[].ports`` and check ``headers`` replace
        the current lists.
      - machines - document that ``statics[].index_document`` takes effect only with
        ``statics[].tigris_bucket``.
      - machines - document that updating a Machine that is created, stopped, suspended,
        or failed leaves it stopped, and that a suspended Machine loses its suspend
        snapshot.
      - machines - reject ``init.tty=true`` before changing the Machine, because Fly.io
        ignores it and the task always failed afterwards.
      - machines - treat replaced and migrated Machines as gone when looking them
        up by ID, and ignore launch-failed Machines except with ``state=absent``.
      - machines, machines_info - document more of the Machine fields that Fly.io
        returns.
      - machines, volumes - with ``state=absent``, look up by name without failing
        when every match is already being deleted.
      - machines_exec - in check mode, fail for a destroyed, replaced, or migrated
        Machine instead of predicting a change.
      - machines_exec - in check mode, fail when the Machine does not exist instead
        of predicting a change.
      - machines_exec - in check mode, fail when the Machine is not ``started`` instead
        of predicting a change, because Fly.io rejects the command.
      - machines_exec - report a change when Fly.io ran the command but could not
        return its output because the output exceeded the maximum response size (HTTP
        413 ``exec_output_too_large``); the task still fails.
      - machines_info - document that a lookup by ``id`` can return a destroyed, replaced,
        or migrated Machine.
      - secrets - document that Ansible masks the secret value wherever it appears
        in the task result.
      - secrets - document that Fly.io may return the masked ``value`` and ``version``
        of a secret that was set.
      - secrets - document that creating or updating a Machine after a secret change
        uses the app's current secrets version instead of referring to an unsupported
        ``min_secrets_version`` option.
      - secrets - document the deprecated ``Version`` field that Fly.io returns alongside
        ``version`` after setting a secret.
      - secrets - in check mode, fail when the app does not exist instead of predicting
        a change.
      - volumes - stop waiting when a volume being created, extended, or settled is
        deleted, and fail with a clear message instead of waiting until the timeout.
      - volumes - treat volumes in the ``fork_cleanup`` and ``waiting_for_detach``
        states as being deleted, like Fly.io's own client does.
      - volumes - with ``state=absent``, fail in check mode when the volume is attached
        to a Machine, as the real delete does, instead of reporting that the volume
        would be deleted.
      - volumes, volumes_info - document ``size_gb`` in GiB, as Fly.io does.
      - volumes, volumes_info - document more of the volume fields that Fly.io returns.
      - volumes, volumes_info - document the ``required_host_features`` field that
        Fly.io returns.
      - volumes_info - document that listing volumes can include volumes that are
        being deleted or were recently destroyed.
      minor_changes:
      - all modules - fall back to the ``FLY_API_TOKEN`` environment variable when
        ``api_token`` is not set.
      - machines - support diff mode; diffs include environment variables, HTTP headers,
        and file contents not set through ``files[].raw_value``.
      - machines, volumes - with ``state=absent``, return the last known resource
        when it was already being deleted, even once it is gone.
      - machines_exec - return every field of the exec response, not only ``exit_code``,
        ``exit_signal``, ``stderr``, and ``stdout``.
      - secrets - support diff mode; diffs show secret names and digests, never values.
      - secrets, secrets_info - return secret metadata as Fly.io reports it instead
        of a fixed field list.
      - volumes - support diff mode.
      release_summary: Bug fix release from repeated audits of the collection's plugins
        and roles against the Fly.io Machines API, fly-go, and live checks. Modules
        now return provider data unmodified, and machines_exec no longer masks output
        with the ``stdin`` value; see Breaking Changes.
    fragments:
    - 1.1.5.yml
    - apps-absent-private-v6-region.yml
    - apps-ip-addresses-role-poll.yml
    - audit-pass-1.yml
    - exec-stdin-volume-waits.yml
    - machines-exec-output-too-large.yml
    - plugins-cleanup.yml
    - volumes-check-attached.yml
    - volumes-machines-exec-states.yml
    release_date: '2026-11-13'
  1.2.0:
    changes:
      breaking_changes:
      - secrets role - default ``secrets_no_log`` to ``true``, because each loop item
        carries the plaintext secret value and Ansible shows it in task output, such
        as with ``-v``. Set ``secrets_no_log`` to ``false`` to keep the previous visible
        output.
      bugfixes:
      - apps - report ``changed=true`` when the app was created or deleted but a later
        read or the deletion wait failed.
      - apps, apps_info, machines, machines_exec, machines_info, secrets, secrets_info,
        volumes, volumes_info - include the reason Fly.io returns with an HTTP error
        in the failure message.
      - apps, ip_addresses, machines, machines_exec, secrets, volumes - report ``changed=true``
        when a write reached Fly.io but its response was lost, for example to a read
        timeout or a dropped connection, because the write may have been applied.
        machines_exec says that the command may have run.
      - apps_info - return an empty ``apps`` list when ``org_slug`` names an organization
        that does not exist, like the other info modules do for a missing parent,
        instead of failing with HTTP 404.
      - apps_info, ip_addresses, ip_addresses_info, machines, machines_info, secrets,
        secrets_info, volumes, volumes_info - read and return resources as Fly.io
        reports them instead of failing on fields the module does not use.
      - ip_addresses - match ``type=private_v6`` only against the organization's default
        network, so ``state=absent`` no longer releases, and ``state=present`` no
        longer reuses, a private address on a custom network.
      - ip_addresses - match and release addresses by ``type`` only when they are
        not assigned to a service, so an address allocated for a service is no longer
        reported as the app's address or released in its place.
      - ip_addresses - report a change after a successful release whatever the mutation
        payload.
      - ip_addresses - report a change, and return the address as Fly.io reports it,
        after a successful allocation; fail with ``changed=true`` only when Fly.io
        returns no address.
      - ip_addresses, ip_addresses_info - return the ``network`` of each address.
      - ip_addresses, ip_addresses_info - return the ``service_name`` an address is
        assigned to.
      - machines - accept a numeric check ``grace_period`` or ``timeout`` below ``1``,
        such as ``0``, which Fly.io accepts and stores, instead of failing before
        the request. A numeric ``interval`` must still be at least ``1``.
      - machines - accept and send ``restart.max_retries`` with any ``restart.policy``,
        as Fly.io does, instead of failing unless the policy is ``on-failure``.
      - machines - accept line breaks in ``files[].raw_value``, such as wrapped ``base64``
        or ``openssl base64`` output, because Fly.io ignores them and stores the value
        as given.
      - machines - drop the current ``restart.max_retries`` when ``restart.policy``
        changes to ``on-failure`` without a requested ``max_retries``, as for any
        other policy change, instead of keeping the old policy's retry limit.
      - machines - keep the current ``restart.max_retries`` on an update that requests
        the current ``restart.policy`` without ``max_retries``, instead of removing
        it. A policy change without a requested ``max_retries`` still drops the stale
        value.
      - machines - omit the Machine's inherited ``guest.max_memory_mb`` when the requested
        ``guest.memory_mb`` exceeds it, so Fly.io applies its default instead of rejecting
        every update with "invalid config.guest.max_memory_mb, must be >= memory_mb".
      - machines - report ``changed=true`` when a Machine was created, updated, started,
        stopped, or destroyed but a later wait, read, or verification failed.
      - machines - require ``restart.max_retries`` to be at least ``1`` before any
        change, including in check mode, because Fly.io stores ``0`` as its default
        of ``3`` and the task could never converge.
      - machines - return the create and update responses as Fly.io reports them instead
        of failing on fields the module does not use.
      - machines_exec - fail with ``changed=true`` when Fly.io reports that the command
        exceeded ``timeout`` (HTTP 408), because the command may have run.
      - machines_exec - include ``error`` in the failure for output that is too large,
        like other API failures.
      - machines_exec - report ``changed=true`` when the command ran but Fly.io returned
        a response that is not an object, and return output fields as Fly.io reports
        them.
      - volumes - report ``changed=true`` when a volume was created, extended, or
        deleted but a later wait failed, and return the create, extend, and delete
        responses as Fly.io reports them.
      minor_changes:
      - all modules - accept a bare ``Bearer`` or ``FlyV1`` ``api_token`` and let
        Fly.io reject it, instead of failing before the request.
      - apps - send a blank ``org_slug`` to Fly.io when creating an app instead of
        failing before the request, and fail on an existing app as a mismatched organization.
      - apps_info - send a blank ``org_slug`` to Fly.io instead of failing before
        the request.
      - ip_addresses - fail on a blank ``address`` as an invalid address instead of
        an empty one.
      - ip_addresses - ignore ``region`` when ``address`` is set, and treat a whitespace-only
        ``region`` as global, instead of failing before the lookup.
      - ip_addresses, ip_addresses_info - send a blank ``app_name`` to Fly.io instead
        of failing before the request.
      - machines - accept a float check ``interval``, ``timeout``, or ``grace_period``
        and compare it as whole nanoseconds, as Fly.io stores it, instead of failing
        before the request with "must be an integer or duration string". A numeric
        ``interval`` below ``1`` still fails before any change, including in check
        mode.
      - machines - add the ``guest.max_memory_mb`` option, the memory in MiB that
        a Machine's memory limit can later be raised to without a restart. It is sent
        as given, and Fly.io checks it against ``guest.memory_mb`` and the per-CPU
        maximum. ``0`` removes the current value. When it is not set, the current
        value is kept unless the requested ``guest.memory_mb`` exceeds it, in which
        case it is omitted and Fly.io applies its default.
      - machines - leave guest memory and CPU rules, mount extension ranges, the single-mount
        limit, the service protocol, enum and type checks for checks, services, autostop,
        environment and metadata values, response headers, and port upper bounds and
        ranges to Fly.io, which rejects them on the only write. A service may now
        omit ``protocol``; Fly.io uses ``tcp``. A null ``env``, ``metadata``, or response
        header value still fails before any change.
      - machines - send a negative ``services[].min_machines_running``, ``services[].concurrency.hard_limit``,
        ``mounts[].extend_threshold_percent``, ``mounts[].add_size_gb``, or ``mounts[].size_gb_limit``
        to Fly.io instead of failing before the request.
      - machines_exec - send an empty ``command`` and a ``timeout`` above 600 to Fly.io
        instead of failing before the request.
      - volumes - send a non-positive ``size_gb`` when creating a volume, and a blank
        ``name``, to Fly.io instead of failing before the request.
    fragments:
    - apps-blank-org-slug.yml
    - check-zero-durations-max-memory.yml
    - converge-retries-lost-writes.yml
    - exec-timeout-private-v6-secrets-no-log.yml
    - float-check-durations.yml
    - machines-max-memory.yml
    - machines-memory-mib.yml
    - machines-wrapped-base64.yml
    - missing-org-restart-retries.yml
    - provider-validation.yml
    - restart-policy-on-failure.yml
    - restart-unchanged-policy.yml
    - service-addresses-null-values.yml
    release_date: '2026-11-18'
  1.2.1:
    changes:
      release_summary: Maintenance release that reworks the role Molecule scenarios
        around a shared base config, runs them in parallel, and verifies that test
        machines start.
    fragments:
    - molecule-scenarios.yml
    - release-summary-1.2.1.yml
