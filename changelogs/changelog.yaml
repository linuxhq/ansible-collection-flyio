    fragments:
    - initial-release.yml
    release_date: '2026-07-28'
  1.0.1:
    changes:
      minor_changes:
      - machines - add files field to inject files into the rootfs overlay at launch.
    fragments:
    - machines-files-field.yml
    release_date: '2026-07-28'
  1.0.2:
    changes:
      minor_changes:
      - machines - add init field to configure container entrypoint, cmd, exec, and
        tty.
      - machines - add volumes_info role dependency for volume id lookups.
    fragments:
    - machines-init-volumes-info-dep.yml
    release_date: '2026-07-28'
  1.0.3:
    changes:
      bugfixes:
      - flyio_utils - fix graphql_request silently discarding HTTP error details.
      - flyio_utils - fix socket timeout on wait_for_machine long-poll requests.
      - flyio_utils - fix values_differ not detecting key removals.
      - flyio_utils - remove dead token field from client dict.
      - flyio_utils - remove unused patch_result function.
      - machines - mark env parameter as no_log to prevent credential exposure.
      minor_changes:
      - machines - add checks field for health check configuration.
      - machines - add metadata field for machine metadata.
      - machines - add restart field for restart policy configuration.
    fragments:
    - v1.0.3.yml
    release_date: '2026-07-31'
  1.0.4:
    changes:
      bugfixes:
      - volumes - ignore volumes pending destruction when resolving resources by name
        or ID.
    fragments:
    - ignore-destroying-volumes.yml
    release_date: '2026-08-03'
  1.0.5:
    changes:
      bugfixes:
      - machines - avoid unnecessary updates when fly.io returns normalized configuration
        metadata.
    fragments:
    - machine-idempotence.yml
    release_date: '2026-08-03'
  1.0.6:
    changes:
      minor_changes:
      - machines_exec - add a module to execute commands on fly.io machines.
    fragments:
    - machines-exec.yml
    release_date: '2026-08-05'
  1.0.7:
    changes:
      breaking_changes:
      - ip_addresses, machines, and volumes roles - group resources by app in nested
        inventory lists.
      bugfixes:
      - apps - force app deletion by default and make the deletion request timeout
        configurable.
      - apps_info, machines_info, and volumes_info - handle missing singular resources
        as documented.
      - flyio_utils - use the FlyV1 authorization scheme when any credential in a
        compound token uses the fm1r or fm2 format.
      - machines - preserve unspecified configuration during updates, purge removed
        dictionary values, reject region changes, and compare image references exactly.
      - volumes - require a region for unambiguous name-based operations.
      minor_changes:
      - info roles - remove the community.general json_query runtime dependency.
      - machines role - pass static file configuration to the machines module.
      - secrets - add modules and roles to manage and inspect fly.io app secrets.
    fragments:
    - app-resource-inventories.yml
    - audit-fixes.yml
    - secrets.yml
    release_date: '2026-08-08'
